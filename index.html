            const handleDragOver = (e) => e.preventDefault();
            const handleDayClick = (dateStr) => {
                if (!selectedActivity) return;
                setActivities(prev => ({ ...prev, [dateStr]: [...(prev[dateStr] || []), selectedActivity] }));
            };
            const removeActivity = (dateStr, index) => {
                setActivities(prev => {
                    const newDayActivities = [...prev[dateStr]];
                    newDayActivities.splice(index, 1);
                    return { ...prev, [dateStr]: newDayActivities };
                });
            };

            const isDateInRange = (year, month, day) => {
                const checkDate = new Date(year, month, day);
                return checkDate >= START_DATE && checkDate <= END_DATE;
            };

            return (
                <div className="min-h-screen bg-neutral-950 text-neutral-100 font-sans selection:bg-red-500/30 pb-20 relative">
                    {isPanicMode && (
                        <div className="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center p-6 text-center">
                            <div className="absolute inset-0 bg-red-900/30 animate-pulse"></div>
                            <img src={MOTIVATION_IMAGES[panicImageIndex]} className="absolute inset-0 w-full h-full object-cover opacity-20" />
                            <div className="relative z-10 flex flex-col items-center max-w-4xl w-full px-4">
                                <Icon name="Skull" className="w-24 h-24 text-red-600 mb-8 animate-bounce" />
                                <h1 className="text-3xl md:text-5xl lg:text-6xl font-black text-red-500 uppercase italic tracking-tighter drop-shadow-2xl leading-tight">
                                    "{PANIC_QUOTES[panicQuoteIndex]}"
                                </h1>
                                <div className="flex flex-col md:flex-row gap-4 mt-16 w-full max-w-2xl justify-center">
                                    <button onClick={cyclePanic} className="flex-1 bg-black/50 hover:bg-neutral-900 border border-neutral-700 text-neutral-300 font-bold py-4 px-6 rounded-full text-sm md:text-base transition-all transform active:scale-95 uppercase tracking-widest">
                                        Hit Me Again. (Next)
                                    </button>
                                    <button onClick={() => setIsPanicMode(false)} className="flex-[2] bg-red-700 hover:bg-red-600 border border-red-500 text-white font-black py-4 px-8 rounded-full text-lg md:text-xl shadow-[0_0_40px_rgba(220,38,38,0.6)] transition-all transform hover:scale-105 active:scale-95 uppercase tracking-widest">
                                        I'm Done Being A B*tch.
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isGraphOpen && (
                        <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-sm flex flex-col items-center justify-center p-4 text-center">
                            <div className="bg-neutral-900 border border-neutral-800 p-6 w-full max-w-5xl rounded-3xl relative shadow-2xl flex flex-col">
                                <button onClick={() => setIsGraphOpen(false)} className="absolute top-4 right-4 p-2 text-neutral-500 hover:text-white transition-colors z-10">
                                    <Icon name="X" className="w-6 h-6" />
                                </button>
                                <h2 className="text-2xl md:text-3xl font-black text-white mb-2 tracking-tighter uppercase italic text-left">
                                    <span className="text-red-500">Weight Loss</span> Trajectory
                                </h2>
                                <p className="text-neutral-400 text-sm mb-6 text-left uppercase font-bold tracking-widest italic">Target: till you get abs wanka.</p>
                                
                                <div className="w-full overflow-x-auto hide-scrollbar bg-neutral-950 rounded-xl border border-neutral-800 p-4">
                                    <div className="min-w-[600px] h-[300px] md:h-[400px] relative">
                                        {(() => {
                                            const svgWidth = 800;
                                            const svgHeight = 400;
                                            const paddingX = 40;
                                            const paddingY = 40;
                                            const maxW = 95;
                                            const minW = 65;
                                            const usableHeight = svgHeight - paddingY * 2;
                                            const getX = (i) => (i / (chartData.length - 1)) * (svgWidth - paddingX * 2) + paddingX;
                                            const getY = (w) => svgHeight - paddingY - ((w - minW) / (maxW - minW)) * usableHeight;
                                            const validPoints = chartData.map((d, i) => d.weight !== null ? `${getX(i)},${getY(d.weight)}` : null).filter(Boolean).join(' ');
                                            
                                            return (
                                                <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} className="w-full h-full font-mono">
                                                    {[65, 75, 85, 95].map(w => (
                                                        <g key={w}>
                                                            <line x1={paddingX} y1={getY(w)} x2={svgWidth - paddingX} y2={getY(w)} stroke="#333" strokeDasharray="4" />
                                                            <text x={paddingX - 10} y={getY(w)} fill="#666" fontSize="12" textAnchor="end" dominantBaseline="middle">{w}kg</text>
                                                        </g>
                                                    ))}
                                                    <polyline points={validPoints} fill="none" stroke="#ef4444" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                                                    {chartData.map((d, i) => {
                                                        const cx = getX(i);
                                                        return (
                                                            <g key={i}>
                                                                <text x={cx} y={svgHeight - 10} fill="#888" fontSize="12" textAnchor="middle">{d.label}</text>
                                                                {d.weight !== null && (
                                                                    <g>
                                                                        <circle cx={cx} cy={getY(d.weight)} r="6" fill={d.isPre ? "#525252" : "#ef4444"} stroke="#0a0a0a" strokeWidth="2" />
                                                                        <text x={cx} y={getY(d.weight) - 15} fill={d.isPre ? "#888" : "white"} fontSize="12" textAnchor="middle" fontWeight="bold">{d.weight.toFixed(1)}</text>
                                                                        {d.diff !== null && (
                                                                            <text x={cx} y={getY(d.weight) + 20} fill={d.diff <= 0 ? "#22c55e" : "#ef4444"} fontSize="10" textAnchor="middle" fontWeight="bold">
                                                                                {d.diff > 0 ? '+' : ''}{d.diff.toFixed(1)}
                                                                            </text>
                                                                        )}
                                                                    </g>
                                                                )}
                                                            </g>
                                                        );
                                                    })}
                                                </svg>
                                            )
                                        })()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="border-b border-neutral-800 bg-neutral-900/50 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <h1 className="text-xl font-black tracking-tighter uppercase italic text-white flex items-center gap-2">
                                <span className="text-red-500">Operation:</span> Rice Bunny
                            </h1>
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-2 bg-neutral-900 px-4 py-2 rounded-full border border-neutral-800 shadow-[0_0_15px_rgba(239,68,68,0.1)]">
                                    <Icon name="Flame" className={`w-5 h-5 ${streak > 0 ? 'text-orange-500' : 'text-neutral-600'}`} />
                                    <span className="font-bold text-lg">
                                        {streak} <span className="text-sm text-neutral-400 font-normal">Day Streak</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div className="bg-red-950/40 border-b border-red-900/50">
                            <div className="max-w-6xl mx-auto px-4 py-2 flex items-center justify-center gap-4 text-red-500 text-xs md:text-sm font-bold tracking-widest uppercase">
                                <Icon name="Clock" className="w-4 h-4" />
                                <span>Time Left:</span>
                                <span className="text-white font-mono">{timeLeft.days}D {String(timeLeft.hours).padStart(2, '0')}H {String(timeLeft.minutes).padStart(2, '0')}M {String(timeLeft.seconds).padStart(2, '0')}S</span>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 mt-8 space-y-8">
                        <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="md:col-span-2 bg-gradient-to-br from-neutral-900 to-neutral-950 p-8 rounded-2xl border border-neutral-800 relative overflow-hidden group cursor-pointer transition-all hover:border-neutral-700" onClick={changeQuote}>
                                <div className="absolute top-0 left-0 w-1 h-full bg-red-600"></div>
                                <div className="flex justify-between items-start mb-4">
                                    <h2 className="text-neutral-500 text-sm font-bold uppercase tracking-widest">Daily Fuel (Tap to cycle)</h2>
                                    <button className="flex items-center gap-1.5 bg-neutral-800 hover:bg-neutral-700 text-red-400 text-xs font-bold px-3 py-1.5 rounded-full transition-colors">
                                        <Icon name="RefreshCw" className="w-3 h-3" />
                                        <span>New Roast</span>
                                    </button>
                                </div>
                                <p className="text-xl md:text-3xl font-bold text-white leading-tight italic min-h-[5rem] flex items-center">
                                    "{QUOTES[activeQuoteIndex]}"
                                </p>
                            </div>
                            <div className="w-full rounded-2xl border border-neutral-800 overflow-hidden relative group">
                                <img src={MOTIVATION_IMAGES[activeImageIndex]} className="w-full h-auto block opacity-100 transition-opacity duration-500" />
                                <div className="absolute bottom-3 right-3 bg-black/50 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-white border border-white/10 shadow-lg pointer-events-none">
                                    The Goal.
                                </div>
                                <button onClick={changeImage} className="absolute top-3 right-3 bg-black/60 hover:bg-black/90 backdrop-blur p-2.5 rounded-full text-white border border-white/20 transition-all shadow-lg flex items-center justify-center hover:scale-105 active:scale-95" title="Next Picture">
                                    <Icon name="RefreshCw" className="w-4 h-4" />
                                </button>
                            </div>
                        </section>

                        <section className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                            <div className="lg:col-span-1 space-y-6">
                                <div className="bg-neutral-900 p-6 rounded-2xl border border-neutral-800 relative overflow-hidden">
                                    <div className="absolute -right-4 -bottom-4 opacity-5"><Icon name="Dumbbell" className="w-32 h-32" /></div>
                                    <h3 className="font-bold uppercase tracking-wider text-sm text-neutral-400 mb-2">Monthly Gym Stats</h3>
                                    <div className="flex items-end gap-3 relative z-10">
                                        <span className="text-6xl font-black text-white leading-none">{gymSessionsThisMonth}</span>
                                        <span className="text-xs text-neutral-500 pb-1 font-medium uppercase tracking-wider">Gym Sessions in<br/><span className="text-red-400 font-bold">{currentDate.toLocaleString('default', { month: 'long' })}</span></span>
                                    </div>
                                </div>
                                <div className="bg-neutral-900 p-6 rounded-2xl border border-neutral-800">
                                    <div className="flex items-center gap-2 mb-4 text-neutral-400">
                                        <Icon name="Weight" className="w-5 h-5" />
                                        <h3 className="font-bold uppercase tracking-wider text-sm">Weight Tracker</h3>
                                    </div>
                                    <div className="relative">
                                        <input type="number" placeholder="e.g. 75" value={weights[currentMonthKey] || ''} onChange={handleWeightChange} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all font-mono text-xl" />
                                        <span className="absolute right-4 top-3.5 text-neutral-500 font-bold">kgs</span>
                                    </div>
                                </div>
                                <div className="bg-neutral-900 p-6 rounded-2xl border border-neutral-800">
                                    <h3 className="font-bold uppercase tracking-wider text-sm text-neutral-400 mb-4">Activities</h3>
                                    <p className="text-xs text-neutral-500 mb-4">Desktop: Drag & Drop. <br/>Mobile: Tap to select, then tap a day.</p>
                                    <div className="space-y-3">
                                        {ACTIVITIES.map(activity => {
                                            const isSelected = selectedActivity === activity.id;
                                            return (
                                                <div key={activity.id} draggable onDragStart={(e) => handleDragStart(e, activity.id)} onClick={() => setSelectedActivity(isSelected ? null : activity.id)} className={`${activity.color} ${isSelected ? 'bg-opacity-40 border-white ring-2 ring-white scale-105' : 'bg-opacity-20 border-transparent'} border text-${activity.color.split('-')[1]}-400 p-3 rounded-xl flex items-center gap-3 cursor-pointer hover:bg-opacity-30 transition-all`}>
                                                    <Icon name={activity.icon} className="w-5 h-5" />
                                                    <span className="font-bold">{activity.name}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* DATA MANAGEMENT BOX WITH FAILSAFE FIXES */}
                                <div className="bg-neutral-900 p-6 rounded-2xl border border-neutral-800">
                                    <div className="flex items-center gap-2 mb-4 text-neutral-400">
                                        <Icon name="Database" className="w-5 h-5" />
                                        <h3 className="font-bold uppercase tracking-wider text-sm">Data Management</h3>
                                    </div>
                                    <div className="space-y-3">
                                        <button onClick={exportData} className="w-full flex items-center justify-center gap-2 bg-neutral-800 hover:bg-neutral-700 text-white p-3 rounded-xl text-sm font-bold transition-colors">
                                            <Icon name="Download" className="w-4 h-4" /> Save Backup File
                                        </button>
                                        
                                        <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="w-full flex items-center justify-center gap-2 border border-neutral-700 hover:bg-neutral-800 text-neutral-300 p-3 rounded-xl text-sm font-bold transition-colors">
                                            <Icon name="Upload" className="w-4 h-4" /> Restore From File
                                        </button>
                                        <input type="file" accept=".json" onChange={importData} ref={fileInputRef} className="hidden" />

                                        <div className="pt-2 border-t border-neutral-800 space-y-2">
                                            <p className="text-[10px] text-neutral-500 uppercase font-bold tracking-wider">Mobile Clipboard Fail-Safe:</p>
                                            <button onClick={copyBackupToClipboard} className="w-full flex items-center justify-center gap-2 bg-red-950/40 hover:bg-red-900/50 border border-red-900/50 text-red-400 p-2.5 rounded-xl text-xs font-bold transition-colors">
                                                <Icon name="Copy" className="w-3.5 h-3.5" /> Copy Backup Text
                                            </button>
                                            <button onClick={restoreFromText} className="w-full flex items-center justify-center gap-2 bg-neutral-950 hover:bg-neutral-800 border border-neutral-800 text-neutral-400 p-2.5 rounded-xl text-xs font-bold transition-colors">
                                                <Icon name="RefreshCw" className="w-3.5 h-3.5" /> Paste Text to Restore
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-3 bg-neutral-900 p-6 rounded-2xl border border-neutral-800">
                                <div className="flex items-center justify-between mb-8">
                                    <h2 className="text-2xl font-black text-white">{currentDate.toLocaleString('default', { month: 'long', year: 'numeric' })}</h2>
                                    <div className="flex gap-2">
                                        <button onClick={prevMonth} className="p-2 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-white transition-colors"><Icon name="ChevronLeft" className="w-5 h-5" /></button>
                                        <button onClick={nextMonth} className="p-2 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-white transition-colors"><Icon name="ChevronRight" className="w-5 h-5" /></button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-7 gap-2 mb-2">
                                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                                        <div key={day} className="text-center text-xs font-bold text-neutral-500 uppercase tracking-wider py-2">{day}</div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-7 gap-2">
                                    {Array.from({ length: firstDayOfMonth }).map((_, index) => (
                                        <div key={`empty-${index}`} className="min-h-[100px] rounded-xl bg-neutral-950/30 border border-neutral-900/50"></div>
                                    ))}
                                    {Array.from({ length: daysInMonth }).map((_, index) => {
                                        const day = index + 1;
                                        const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                        const inRange = isDateInRange(currentDate.getFullYear(), currentDate.getMonth(), day);
                                        const dayActivities = activities[dateStr] || [];
                                        return (
                                            <div key={dateStr} onDragOver={inRange ? handleDragOver : undefined} onDrop={inRange ? (e) => handleDrop(e, dateStr) : undefined} onClick={inRange ? () => handleDayClick(dateStr) : undefined} className={`min-h-[100px] rounded-xl border p-2 flex flex-col transition-colors ${inRange ? `bg-neutral-950 border-neutral-800 hover:border-neutral-600 ${selectedActivity ? 'cursor-crosshair hover:bg-neutral-900' : ''}` : 'bg-neutral-950/30 border-neutral-900/50 opacity-50 cursor-not-allowed'}`}>
                                                <span className={`text-sm font-bold mb-2 ${inRange ? 'text-neutral-400' : 'text-neutral-700'}`}>{day}</span>
                                                <div className="flex-1 space-y-1 overflow-y-auto hide-scrollbar">
                                                    {dayActivities.map((actId, idx) => {
                                                        const activity = ACTIVITIES.find(a => a.id === actId);
                                                        if (!activity) return null;
                                                        return (
                                                            <div key={`${dateStr}-${idx}`} className={`${activity.color} text-white text-[10px] font-bold px-2 py-1.5 rounded-md flex items-center justify-between group`}>
                                                                <div className="flex items-center gap-1.5 overflow-hidden">
                                                                    <Icon name={activity.icon} className="w-3 h-3 flex-shrink-0" />
                                                                    <span className="truncate">{activity.name}</span>
                                                                </div>
                                                                <button onClick={(e) => { e.stopPropagation(); removeActivity(dateStr, idx); }} className="opacity-100 md:opacity-0 md:group-hover:opacity-100 hover:bg-black/20 rounded p-0.5 transition-all bg-black/20 md:bg-transparent">
                                                                    <Icon name="X" className="w-3 h-3" />
                                                                </button>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </section>
                    </main>

                    <button onClick={() => setIsGraphOpen(true)} className="fixed bottom-6 left-6 z-40 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-white rounded-full p-4 shadow-[0_0_20px_rgba(0,0,0,0.5)] flex items-center justify-center hover:scale-110 active:scale-90 transition-all group">
                        <Icon name="LineChart" className="w-8 h-8 text-neutral-400 group-hover:text-white" />
                    </button>

                    <button onClick={triggerPanic} className="fixed bottom-6 right-6 z-40 bg-red-600 hover:bg-red-500 text-white rounded-full p-4 shadow-[0_0_20px_rgba(220,38,38,0.5)] flex items-center justify-center hover:scale-110 active:scale-90 transition-all group">
                        <Icon name="AlertTriangle" className="w-8 h-8 group-hover:animate-bounce" />
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
